# Optional log destination.
log_file = "blob-solver-session.jsonl"

[board]
rows = 10
cols = 10
min_group = 2
num_colors = 4

[vision]
patch_ratio = 0.45
confidence_threshold = 0.90
settle_frames = 3
settle_interval_ms = 80
settle_timeout_seconds = 3.0

[solver]
mode = "hybrid"
quality = "balanced" # fast, balanced, deep, exhaustive
time_limit_seconds = 5.0
beam_width = 700
max_nodes = 180000
candidate_moves = 48
exact_endgame_blocks = 25
exact_legal_groups = 8
exact_work_limit = 140
rollout_seed = 0
process_count = 0 # 0 = automatic bounded root workers; 1 = serial

[automation]
click_delay_ms = 150
animation_delay_ms = 350
verified_execution = false

[desktop]
backend = "auto"
input_space = "logical" # logical is the default; physical is diagnostic/explicit

# This is filled by blob-solver select-region:
# [region]
# x = 100
# y = 200
# width = 820
# height = 740
