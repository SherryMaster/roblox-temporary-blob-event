[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blob-solver"
version = "0.1.0"
description = "Computer-vision assisted SameGame solver with safe Wayland automation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Pillow>=10.0",
]

[project.optional-dependencies]
desktop = [
    "mss>=9.0",
]
ui = [
    "PySide6>=6.6",
]
test = [
    "pytest>=8.0",
]
all = [
    "mss>=9.0",
    "PySide6>=6.6",
    "pytest>=8.0",
]

[project.scripts]
blob-solver = "blob_solver.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
